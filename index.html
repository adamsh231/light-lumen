<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Atelier Lumen — Interactive Lighting Studio & Collection</title>
  
  <!-- Lamp SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <!-- Modern Typography (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wall-texture"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="brand" id="brandBtn">
      <h1 class="brand-name">Atelier Lumen</h1>
      <span class="brand-tag">Architectural Lighting</span>
    </div>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- Sound Toggle -->
      <button class="icon-btn" id="soundToggleBtn" title="Toggle Switch Sound (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>

      <!-- Day / Night Mood Toggle -->
      <button class="icon-btn" id="themeToggleBtn" title="Toggle Day / Night Mood (D)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- =========================================================================
       VIEW 1: MAIN SHOWROOM DISPLAY (FULL-PAGE IMMERSIVE FIXTURE CANVAS)
       ========================================================================= -->
  <main class="view-panel" id="studioViewPanel">
    <div class="studio-fullscreen-viewport">
      
      <!-- Top-Left Floating Overlay: Back Button + Fixture Metadata -->
      <div class="studio-top-overlay">
        <a href="/" class="studio-back-btn" id="studioBackBtn" title="Back to All Lighting">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>All Lighting</span>
        </a>
        <div class="studio-fixture-info">
          <span class="studio-category-tag" id="stageCategory">CHANDELIER</span>
          <h2 class="studio-main-title" id="stageTitle">Murano Glass Cosmos Chandelier</h2>
          <span class="studio-main-price" id="stagePrice">$8000</span>
        </div>
      </div>

      <!-- FULL-BLEED IMMERSIVE FIXTURE CANVAS -->
      <div class="sconce-fullscreen-canvas" id="sconceLamp" role="button" tabindex="0" title="Click fixture to toggle light">
        <!-- Dynamic Ambient Glow Halo Behind Lamp -->
        <div class="ambient-glow-halo" id="ambientHalo"></div>

        <!-- Base Off Image Layer (Full Page) -->
        <img 
          id="imgOff" 
          class="sconce-img img-off" 
          src="/downloads/images/murano-glass-cosmos-chandelier-3-goto-bianco-polished-nickel-17-36-inches/01_off_InCommonWith_MuranoGlassCosmosChandelier_FrontView_Off_GotoB.jpg" 
          alt="Lamp Off State"
        />
        
        <!-- Dynamic On Image Layer (Full Page) -->
        <img 
          id="imgOn" 
          class="sconce-img img-on" 
          src="/downloads/images/murano-glass-cosmos-chandelier-3-goto-bianco-polished-nickel-17-36-inches/02_on_InCommonWith_MuranoGlassCosmosChandelier_FrontView_On_GotoBi.jpg" 
          alt="Lamp On State"
        />

        <!-- Seamless Wall-Mounted Switch Inside Upper-Right Corner of the Image -->
        <div class="seamless-wall-switch-stage" id="seamlessSwitchStage">
          <!-- STYLE 1: 3D Tactile Rocker Switch -->
          <div class="tactile-switch-bay" id="rockerView">
            <div class="rocker-plate-bezel">
              <div class="plate-screw screw-top"></div>
              <button class="rocker-button" id="rockerSwitchBtn" aria-label="Rocker Wall Switch" title="Toggle Light">
                <div class="rocker-surface">
                  <span class="rocker-label label-off">OFF</span>
                  <div class="rocker-indicator-bar"></div>
                  <span class="rocker-label label-on">ON</span>
                </div>
              </button>
              <div class="plate-screw screw-bot"></div>
            </div>
          </div>

          <!-- STYLE 2: Push Button -->
          <div class="push-switch-view" id="pushView" style="display:none;">
            <div class="push-button-base">
              <button class="push-button-core" id="pushSwitchBtn" aria-label="Push Button Switch" title="Toggle Light">
                <svg class="push-icon" viewBox="0 0 24 24">
                  <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- STYLE 3: Solid Brass Toggle Lever -->
          <div class="lever-switch-view" id="leverView" style="display:none;">
            <div class="lever-plate" id="leverSwitchBtn" role="button" tabindex="0" aria-label="Toggle Lever Switch" title="Toggle Light">
              <div class="lever-handle">
                <div class="lever-knob"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- STUDIO LUXURY FLOATING BOTTOM DOCK -->
      <div class="floating-dock-wrapper studio-dock-wrapper" id="studioFloatingDockWrapper">
        <div class="floating-dock studio-dock">
          
          <!-- Segment 1: Previous & Next Navigation -->
          <div class="studio-dock-nav-segment">
            <button class="dock-nav-btn" id="prevLampBtn" title="Previous Fixture">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span class="studio-dock-counter" id="stageCounterBadge">1 / 82</span>
            <button class="dock-nav-btn" id="nextLampBtn" title="Next Fixture">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>

          <div class="dock-divider"></div>

          <!-- Segment 2: Switch Style Dropdown Selector -->
          <div class="dock-category-segment custom-dropdown" id="switchStyleDropdownContainer">
            <button class="dock-category-btn" id="switchStyleDropdownBtn" type="button" aria-haspopup="listbox" aria-expanded="false" title="Select Wall Switch Model">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 7v10"/></svg>
              <span class="category-btn-label" id="switchStyleBtnLabel">Rocker</span>
              <svg class="chevron-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            <!-- Upward Switch Style Menu -->
            <div class="custom-dropdown-menu upward-menu switch-style-menu" id="switchStyleDropdownMenu" role="listbox">
              <div class="dropdown-menu-header">
                <span class="dropdown-menu-title">SWITCH MODEL</span>
              </div>
              <div class="dropdown-options-list switch-mode-tabs">
                <button class="dropdown-option tab-btn active" data-switch="rocker">
                  <span>Rocker Switch</span>
                </button>
                <button class="dropdown-option tab-btn" data-switch="push">
                  <span>Push Button</span>
                </button>
                <button class="dropdown-option tab-btn" data-switch="lever">
                  <span>Toggle Lever</span>
                </button>
              </div>
            </div>
          </div>

          <div class="dock-divider"></div>

          <!-- Segment 3: Dimmer Luminance Slider -->
          <div class="studio-dock-dimmer-segment">
            <div class="studio-dimmer-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
            </div>
            <input 
              type="range" 
              min="0" 
              max="100" 
              value="0" 
              class="studio-dock-slider" 
              id="brightnessSlider" 
              aria-label="Dimmer Luminance Slider"
              title="Adjust Luminance"
            />
            <span class="studio-dimmer-percent" id="brightnessValue">0%</span>
          </div>

          <div class="dock-divider"></div>

          <!-- Segment 4: Ambience & Halo Configuration Popover Trigger -->
          <div class="dock-overlay-segment" id="studioAmbienceContainer">
            <button class="dock-overlay-btn" id="studioAmbienceBtn" type="button" aria-haspopup="dialog" aria-expanded="false" title="Ambient Glow & Color Temperature Settings">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
              <span>Ambience</span>
              <svg class="chevron-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            <!-- Upward Ambience Config Popover -->
            <div class="overlay-config-popover studio-ambience-popover" id="studioAmbiencePopover">
              <div class="overlay-popover-header">
                <span class="overlay-popover-title">AMBIENCE & GLOW</span>
              </div>

              <!-- Halo Toggle Row -->
              <div class="overlay-option-item" id="ambientGlowToggleRow">
                <span class="overlay-option-label">Ambient Glow Halo</span>
                <label class="toggle-switch-wrap" title="Toggle ambient glow halo">
                  <input type="checkbox" class="toggle-checkbox" id="gradientToggle" checked>
                  <div class="toggle-track">
                    <div class="toggle-handle"></div>
                  </div>
                </label>
              </div>

              <!-- Color Temperature Presets -->
              <div class="studio-temp-picker">
                <span class="studio-temp-title">Color Temperature:</span>
                <div class="color-preset-pills">
                  <button class="color-btn active" data-source="auto">Auto</button>
                  <button class="color-btn" data-source="2200k">2200K</button>
                  <button class="color-btn" data-source="2700k">2700K</button>
                  <button class="color-btn" data-source="3500k">3500K</button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- =========================================================================
       VIEW 2: CURATED COLLECTION GALLERY
       ========================================================================= -->
  <section class="view-panel gallery-view active" id="galleryViewPanel">
    
    <!-- Floating Bottom Luxury Dock -->
    <div class="floating-dock-wrapper" id="galleryFloatingDockWrapper">
      <nav class="floating-dock" id="galleryFloatingDock" aria-label="Lighting Controls Dock">
        
        <!-- Search Input Segment -->
        <div class="dock-search-segment">
          <svg class="dock-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="dock-search-input" id="gallerySearchInput" placeholder="Search fixtures, materials, types..." autocomplete="off">
        </div>

        <span class="dock-divider" aria-hidden="true"></span>

        <!-- Custom Category Dropdown Segment -->
        <div class="dock-category-segment custom-dropdown" id="categoryDropdownWrapper">
          <button type="button" class="dock-category-btn" id="categoryDropdownBtn" aria-haspopup="listbox" aria-expanded="false" title="Filter by Category">
            <span class="category-btn-label" id="categoryBtnLabel">All Categories</span>
            <span class="category-btn-badge" id="categoryBtnBadge">82</span>
            <svg class="chevron-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>

          <!-- Custom Glassmorphism Dropdown Menu (Opens Upward Above Dock) -->
          <div class="custom-dropdown-menu upward-menu" id="categoryDropdownMenu" role="listbox" aria-label="Collection Categories List">
            <div class="dropdown-menu-header">
              <span class="dropdown-menu-title">COLLECTION CATEGORIES</span>
            </div>
            <div class="dropdown-options-list" id="categoryOptionsList">
              <button type="button" class="dropdown-option active" role="option" data-cat="all" aria-selected="true">
                <span class="option-name">All Categories</span>
                <span class="option-count">82</span>
              </button>
              <button type="button" class="dropdown-option" role="option" data-cat="Surface Mount">
                <span class="option-name">Surface Mount</span>
                <span class="option-count">20</span>
              </button>
              <button type="button" class="dropdown-option" role="option" data-cat="Pendant">
                <span class="option-name">Pendant</span>
                <span class="option-count">18</span>
              </button>
              <button type="button" class="dropdown-option" role="option" data-cat="Sconce">
                <span class="option-name">Sconce</span>
                <span class="option-count">15</span>
              </button>
              <button type="button" class="dropdown-option" role="option" data-cat="Table Lamp">
                <span class="option-name">Table Lamp</span>
                <span class="option-count">15</span>
              </button>
              <button type="button" class="dropdown-option" role="option" data-cat="Floor Lamp">
                <span class="option-name">Floor Lamp</span>
                <span class="option-count">4</span>
              </button>
              <button type="button" class="dropdown-option" role="option" data-cat="Plug-in Sconce">
                <span class="option-name">Plug-in Sconce</span>
                <span class="option-count">4</span>
              </button>
              <button type="button" class="dropdown-option" role="option" data-cat="ADA Sconce">
                <span class="option-name">ADA Sconce</span>
                <span class="option-count">4</span>
              </button>
              <button type="button" class="dropdown-option" role="option" data-cat="Chandelier">
                <span class="option-name">Chandelier</span>
                <span class="option-count">2</span>
              </button>
            </div>
          </div>
        </div>

        <span class="dock-divider" aria-hidden="true"></span>

        <!-- Grid Columns Selector Segment -->
        <div class="dock-grid-segment" id="gridColumnsControl" title="Grid Columns Density">
          <svg class="dock-grid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <div class="dock-grid-btn-group" role="group" aria-label="Select Grid Columns">
            <button type="button" class="dock-grid-btn" data-cols="2">2</button>
            <button type="button" class="dock-grid-btn" data-cols="3">3</button>
            <button type="button" class="dock-grid-btn active" data-cols="4">4</button>
            <button type="button" class="dock-grid-btn" data-cols="5">5</button>
            <button type="button" class="dock-grid-btn" data-cols="6">6</button>
          </div>
        </div>

        <span class="dock-divider" aria-hidden="true"></span>

        <!-- Info Grid Popover Segment -->
        <div class="dock-overlay-segment" id="overlayConfigMenuWrapper">
          <button type="button" class="dock-overlay-btn" id="overlayConfigTriggerBtn" aria-expanded="false" title="Grid Info Overlay Settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>Info</span>
            <svg class="chevron-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>

          <!-- Floating Glassmorphism Popover (Opens Upward) -->
          <div class="overlay-config-popover" id="overlayConfigPopover" role="dialog" aria-label="Grid Info Overlay Settings">
            <div class="overlay-popover-header">
              <span class="overlay-popover-title">OVERLAY VISIBILITY</span>
              <button type="button" class="overlay-popover-toggle-all" id="overlayToggleAllBtn">Show All</button>
            </div>

            <div class="overlay-options-list">
              <label class="overlay-option-item">
                <span class="overlay-option-label">Fixture Title</span>
                <input type="checkbox" class="overlay-checkbox-input" id="overlayCheckTitle">
                <span class="overlay-switch-slider"></span>
              </label>

              <label class="overlay-option-item">
                <span class="overlay-option-label">Category Tag</span>
                <input type="checkbox" class="overlay-checkbox-input" id="overlayCheckCategory">
                <span class="overlay-switch-slider"></span>
              </label>

              <label class="overlay-option-item">
                <span class="overlay-option-label">Price Tag</span>
                <input type="checkbox" class="overlay-checkbox-input" id="overlayCheckPrice">
                <span class="overlay-switch-slider"></span>
              </label>

              <label class="overlay-option-item">
                <span class="overlay-option-label">Studio Link</span>
                <input type="checkbox" class="overlay-checkbox-input" id="overlayCheckStudio">
                <span class="overlay-switch-slider"></span>
              </label>

              <label class="overlay-option-item">
                <span class="overlay-option-label">Quick Toggle Bar</span>
                <input type="checkbox" class="overlay-checkbox-input" id="overlayCheckTopBar">
                <span class="overlay-switch-slider"></span>
              </label>
            </div>
          </div>
        </div>

        <span class="dock-divider" aria-hidden="true"></span>

        <!-- Master Switch Icon-Only Toggle Segment -->
        <button type="button" class="dock-master-toggle" id="galleryMasterToggleBtn" role="switch" aria-checked="false" title="Master Light Switch (Turn All On/Off)">
          <span class="dock-toggle-bulb">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
              <path d="M9 18h6m-5 4h4M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-.8 2.3-1.5 3-.7.7-1 1.5-1 2.5h-2c0-1-.3-1.8-1-2.5C9.3 11.3 8.5 10.5 8.5 9a3.5 3.5 0 0 1 1-2.5"/>
            </svg>
          </span>
          <span class="dock-toggle-track">
            <span class="dock-toggle-thumb"></span>
          </span>
        </button>

      </nav>
    </div>

    <!-- Curated Products Grid -->
    <div class="lamp-products-grid" id="lampProductsGrid">
      <!-- Rendered via JS -->
    </div>

  </section>

  <!-- Hidden Auto-Sampler Canvas -->
  <canvas id="colorSamplerCanvas" width="40" height="40" style="display:none;"></canvas>

  <!-- Main Application Entrypoint (Bundled via Vite) -->
  <script type="module" src="/main.js"></script>
</body>
</html>
